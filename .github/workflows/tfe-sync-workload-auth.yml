name: TFE Sync Workload Auth

# Reads TFC_GCP_* Terraform OUTPUTS from GCP-vaflt-tfe-workspace state and replaces
# the same workspace env vars (workload own SA + WIF for self-run auth).
#
# GitHub secret: TFE_TOKEN
# Triggered by: TFE Webhook Router (tfe-workload-applied) or manual Run workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional TFE run ID (from webhook)
        required: false
        type: string
        default: ""

env:
  GIT_BRANCH: feature/new-bootstrap

jobs:
  sync-workload-auth:
    name: Outputs -> GCP-vaflt-tfe-workspace env vars
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Read outputs and replace workspace TFC_GCP env vars
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
          TFE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          TFE_HOSTNAME="app.terraform.io"
          TFE_ORG="vaflt-org"
          WORKLOAD_NAME="GCP-vaflt-tfe-workspace"
          API="https://${TFE_HOSTNAME}/api/v2"

          auth() { echo "Authorization: Bearer ${TFE_TOKEN}"; }

          if [ -z "${TFE_TOKEN:-}" ]; then
            echo "Missing secret TFE_TOKEN"
            exit 1
          fi

          resolve_workspace_id() {
            curl -sS --header "$(auth)" --header "Content-Type: application/vnd.api+json" \
              "${API}/organizations/${TFE_ORG}/workspaces/$1" \
              | jq -r '.data.id // empty'
          }

          read_output() {
            curl -sS --header "$(auth)" --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/$1/current-state-version-outputs" \
              | jq -r --arg k "$2" '
                  [.data[]? | select(.attributes.name == $k)][0].attributes.value
                  | if . == null then empty elif type == "string" then . else tostring end
                '
          }

          upsert_env_var() {
            local ws_id="$1" key="$2" value="$3" existing_id
            existing_id=$(curl -sS --header "$(auth)" --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/vars?page%5Bsize%5D=100" \
              | jq -r --arg k "$key" '
                  [.data[]? | select(.attributes.key == $k and .attributes.category == "env")][0].id // empty
                ')
            if [ -n "$existing_id" ]; then
              curl -sS --header "$(auth)" --header "Content-Type: application/vnd.api+json" \
                --request PATCH \
                --data "$(jq -n --arg val "$value" '{data:{type:"vars",attributes:{value:$val}}}')" \
                "${API}/vars/${existing_id}" >/dev/null
            else
              curl -sS --header "$(auth)" --header "Content-Type: application/vnd.api+json" \
                --request POST \
                --data "$(jq -n --arg key "$key" --arg val "$value" '{
                  data:{type:"vars",attributes:{key:$key,value:$val,category:"env",hcl:false,sensitive:false}}
                }')" \
                "${API}/workspaces/${ws_id}/vars" >/dev/null
            fi
            echo "  replaced ${key} on ${WORKLOAD_NAME}"
          }

          WORKLOAD_ID=$(resolve_workspace_id "$WORKLOAD_NAME")
          if [ -z "$WORKLOAD_ID" ]; then
            echo "Could not find ${WORKLOAD_NAME}"
            exit 1
          fi

          echo "=== Sync: Terraform outputs -> workspace env vars ==="
          echo "Workspace: ${WORKLOAD_NAME} (${WORKLOAD_ID})"
          [ -n "${TFE_RUN_ID:-}" ] && echo "Webhook run: ${TFE_RUN_ID}"
          echo ""
          echo "Reading outputs from state..."

          SA="" WIF=""
          for attempt in $(seq 1 12); do
            SA=$(read_output "$WORKLOAD_ID" "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL")
            WIF=$(read_output "$WORKLOAD_ID" "TFC_GCP_WORKLOAD_PROVIDER_NAME")
            if [ -n "$SA" ] && [ "$SA" != "null" ] && [ -n "$WIF" ] && [ "$WIF" != "null" ]; then
              echo "  TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL=${SA}"
              echo "  TFC_GCP_WORKLOAD_PROVIDER_NAME=${WIF}"
              break
            fi
            echo "  attempt ${attempt}/12: outputs not in state yet..."
            sleep 10
          done

          if [ -z "$SA" ] || [ -z "$WIF" ]; then
            echo "FAIL: apply must finish first — outputs TFC_GCP_* missing"
            exit 1
          fi

          echo ""
          echo "Replacing env vars on ${WORKLOAD_NAME}..."
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_PROVIDER_AUTH" "true"
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_PRINCIPAL_TYPE" "service_account"
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_AUTH_IDENTITY" "workload"
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL" "$SA"
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_WORKLOAD_PROVIDER_NAME" "$WIF"

          echo ""
          echo "Done — next run uses workload own identity (from outputs)."
