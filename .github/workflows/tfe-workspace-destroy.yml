name: Destroy TFE Workload and Reset Bootstrap Auth

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy to confirm full workspace destroy'
        required: true
        type: string
      message:
        description: Message shown on the TFE destroy run
        required: false
        default: Destroy from GitHub Actions

jobs:
  destroy-and-reset-bootstrap-auth:
    name: Destroy workload and copy bootstrap auth variables
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    permissions:
      contents: read

    steps:
      - name: Destroy workload and copy bootstrap auth variables
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
          TFE_WORKSPACE_ID: ${{ secrets.TFE_WORKSPACE_ID }}
          TFE_HOSTNAME: ${{ vars.TFE_HOSTNAME }}
          TFE_ORG: ${{ vars.TFE_ORG }}
          TFE_BOOTSTRAP_WORKSPACE_NAME: ${{ vars.TFE_BOOTSTRAP_WORKSPACE_NAME }}
          RUN_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail

          TFE_HOSTNAME="${TFE_HOSTNAME:-app.terraform.io}"
          TFE_ORG="${TFE_ORG:-vaflt-org}"
          BOOTSTRAP_NAME="${TFE_BOOTSTRAP_WORKSPACE_NAME:-GCP-Bootstrap}"
          API="https://${TFE_HOSTNAME}/api/v2"

          auth() {
            echo "Authorization: Bearer ${TFE_TOKEN}"
          }

          if [ -z "${TFE_TOKEN:-}" ]; then
            echo "Missing secret TFE_TOKEN"
            exit 1
          fi

          if [ -z "${TFE_WORKSPACE_ID:-}" ]; then
            echo "Missing secret TFE_WORKSPACE_ID"
            exit 1
          fi

          WORKLOAD_ID="${TFE_WORKSPACE_ID}"

          echo "Looking up bootstrap workspace: ${BOOTSTRAP_NAME}"

          BOOTSTRAP_JSON=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            "${API}/organizations/${TFE_ORG}/workspaces/${BOOTSTRAP_NAME}")

          BOOTSTRAP_ID=$(echo "$BOOTSTRAP_JSON" | jq -r '.data.id // empty')

          if [ -z "$BOOTSTRAP_ID" ]; then
            echo "Could not find bootstrap workspace ${BOOTSTRAP_NAME}"
            echo "$BOOTSTRAP_JSON" | jq '.errors // .'
            exit 1
          fi

          WORKLOAD_NAME=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            "${API}/workspaces/${WORKLOAD_ID}" \
            | jq -r '.data.attributes.name // "unknown"')

          echo "Workload workspace: ${WORKLOAD_NAME} (${WORKLOAD_ID})"
          echo "Bootstrap workspace: ${BOOTSTRAP_NAME} (${BOOTSTRAP_ID})"

          read_env_var_from_workspace() {
            local ws_id="$1"
            local key="$2"

            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/vars?page%5Bsize%5D=100" \
              | jq -r --arg k "$key" '
                  [.data[]? 
                    | select(.attributes.key == $k and .attributes.category == "env")
                  ][0].attributes.value // empty
                '
          }

          upsert_env_var() {
            local ws_id="$1"
            local key="$2"
            local value="$3"

            existing_id=$(curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/vars?page%5Bsize%5D=100" \
              | jq -r --arg k "$key" '
                  [.data[]? 
                    | select(.attributes.key == $k and .attributes.category == "env")
                  ][0].id // empty
                ')

            if [ -n "$existing_id" ]; then
              curl -sS \
                --header "$(auth)" \
                --header "Content-Type: application/vnd.api+json" \
                --request PATCH \
                --data "$(jq -n --arg val "$value" '{
                  data: {
                    type: "vars",
                    attributes: {
                      value: $val
                    }
                  }
                }')" \
                "${API}/vars/${existing_id}" >/dev/null

              echo "Updated ${key} on ${WORKLOAD_NAME}"
            else
              curl -sS \
                --header "$(auth)" \
                --header "Content-Type: application/vnd.api+json" \
                --request POST \
                --data "$(jq -n --arg key "$key" --arg val "$value" '{
                  data: {
                    type: "vars",
                    attributes: {
                      key: $key,
                      value: $val,
                      category: "env",
                      hcl: false,
                      sensitive: false
                    }
                  }
                }')" \
                "${API}/workspaces/${ws_id}/vars" >/dev/null

              echo "Created ${key} on ${WORKLOAD_NAME}"
            fi
          }

          copy_bootstrap_auth_to_workload() {
            echo "Reading bootstrap auth variables..."

            BOOTSTRAP_SA_EMAIL=$(read_env_var_from_workspace "$BOOTSTRAP_ID" "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL")
            BOOTSTRAP_WIF_PROVIDER=$(read_env_var_from_workspace "$BOOTSTRAP_ID" "TFC_GCP_WORKLOAD_PROVIDER_NAME")

            if [ -z "$BOOTSTRAP_SA_EMAIL" ]; then
              echo "Missing TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL in bootstrap workspace"
              exit 1
            fi

            if [ -z "$BOOTSTRAP_WIF_PROVIDER" ]; then
              echo "Missing TFC_GCP_WORKLOAD_PROVIDER_NAME in bootstrap workspace"
              exit 1
            fi

            echo "Copying bootstrap auth variables to workload workspace..."

            upsert_env_var "$WORKLOAD_ID" "TFC_GCP_PROVIDER_AUTH" "true"
            upsert_env_var "$WORKLOAD_ID" "TFC_GCP_PRINCIPAL_TYPE" "service_account"
            upsert_env_var "$WORKLOAD_ID" "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL" "$BOOTSTRAP_SA_EMAIL"
            upsert_env_var "$WORKLOAD_ID" "TFC_GCP_WORKLOAD_PROVIDER_NAME" "$BOOTSTRAP_WIF_PROVIDER"

            echo "Bootstrap auth variables copied successfully."
          }

          queue_destroy_run() {
            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data "$(jq -n \
                --arg ws "$WORKLOAD_ID" \
                --arg msg "$RUN_MESSAGE" \
                '{
                  data: {
                    type: "runs",
                    attributes: {
                      message: $msg,
                      "is-destroy": true
                    },
                    relationships: {
                      workspace: {
                        data: {
                          type: "workspaces",
                          id: $ws
                        }
                      }
                    }
                  }
                }')" \
              "${API}/runs"
          }

          poll_run_status() {
            local run_id="$1"

            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/runs/${run_id}" \
              | jq -r '.data.attributes.status'
          }

          wait_for_status() {
            local run_id="$1"
            local want_status="$2"
            local label="$3"
            local max_polls="$4"

            for i in $(seq 1 "$max_polls"); do
              status=$(poll_run_status "$run_id")
              echo "${label} poll ${i}: ${status}"

              case "$status" in
                "$want_status")
                  return 0
                  ;;
                errored|canceled|discarded)
                  echo "${label} failed with status: ${status}"
                  exit 1
                  ;;
              esac

              sleep 10
            done

            echo "Timed out waiting for ${label} to reach ${want_status}"
            exit 1
          }

          run_destroy() {
            echo "Queueing destroy run..."

            RUN_RESPONSE=$(queue_destroy_run)
            DESTROY_RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.data.id // empty')

            if [ -z "$DESTROY_RUN_ID" ]; then
              echo "Failed to queue destroy run"
              echo "$RUN_RESPONSE" | jq '.errors // .'
              exit 1
            fi

            echo "Destroy run ID: ${DESTROY_RUN_ID}"

            wait_for_status "$DESTROY_RUN_ID" "planned" "destroy plan" 60

            echo "Applying destroy run..."

            APPLY_RESPONSE=$(curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              "${API}/runs/${DESTROY_RUN_ID}/actions/apply")

            if echo "$APPLY_RESPONSE" | jq -e '.errors' >/dev/null 2>&1; then
              echo "Destroy apply failed:"
              echo "$APPLY_RESPONSE" | jq '.errors'
              exit 1
            fi

            wait_for_status "$DESTROY_RUN_ID" "applied" "destroy apply" 90

            echo "Destroy completed successfully."
          }

          run_destroy
          copy_bootstrap_auth_to_workload

          echo ""
          echo "Done."
          echo "Destroyed workload workspace resources."
          echo "Copied bootstrap variables to workload workspace."
          echo "No recreate or apply was performed."

  reject-unconfirmed:
    name: Destroy not confirmed
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'destroy'
    steps:
      - name: Require confirmation
        run: |
          echo "Destroy cancelled. Re-run and type exactly: destroy"
          exit 1
