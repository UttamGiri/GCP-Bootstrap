name: Destroy TFE Workload and Reset Bootstrap Auth

# Queues a destroy run in the workload TFE workspace, applies it, then copies
# bootstrap GCP auth env vars back to the workload workspace for a fresh first run.
#
# Required GitHub secrets:
#   TFE_TOKEN            - user API token
#   TFE_WORKSPACE_ID     - workload workspace ID (ws-8nSCANEJTL1guUNk)
#
# Optional variables:
#   TFE_HOSTNAME         - default app.terraform.io
#   TFE_ORG              - default vaflt-org
#   TFE_BOOTSTRAP_WORKSPACE_NAME - default GCP-Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy to confirm full workspace destroy'
        required: true
        type: string
      message:
        description: Message shown on the TFE destroy run
        required: false
        default: Destroy queued from GitHub Actions

jobs:
  destroy-and-reset-auth:
    name: Destroy workload in TFE and reset TFC_GCP_* vars
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    permissions:
      contents: read

    steps:
      - name: Destroy in TFE and copy bootstrap auth variables
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
          TFE_WORKSPACE_ID: ${{ secrets.TFE_WORKSPACE_ID }}
          TFE_HOSTNAME: ${{ vars.TFE_HOSTNAME }}
          TFE_ORG: ${{ vars.TFE_ORG }}
          TFE_BOOTSTRAP_WORKSPACE_NAME: ${{ vars.TFE_BOOTSTRAP_WORKSPACE_NAME }}
          RUN_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail

          TFE_HOSTNAME="${TFE_HOSTNAME:-app.terraform.io}"
          TFE_ORG="${TFE_ORG:-vaflt-org}"
          BOOTSTRAP_NAME="${TFE_BOOTSTRAP_WORKSPACE_NAME:-GCP-Bootstrap}"
          API="https://${TFE_HOSTNAME}/api/v2"

          auth() { echo "Authorization: Bearer ${TFE_TOKEN}"; }

          if [ -z "${TFE_TOKEN:-}" ]; then
            echo "Missing secret TFE_TOKEN"
            exit 1
          fi
          if [ -z "${TFE_WORKSPACE_ID:-}" ]; then
            echo "Missing secret TFE_WORKSPACE_ID (workload workspace)"
            exit 1
          fi

          WORKLOAD_ID="${TFE_WORKSPACE_ID}"

          echo "Looking up bootstrap workspace: ${BOOTSTRAP_NAME}"
          BOOTSTRAP_JSON=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            "${API}/organizations/${TFE_ORG}/workspaces/${BOOTSTRAP_NAME}")
          BOOTSTRAP_ID=$(echo "$BOOTSTRAP_JSON" | jq -r '.data.id // empty')
          if [ -z "$BOOTSTRAP_ID" ]; then
            echo "Could not find bootstrap workspace ${BOOTSTRAP_NAME}"
            echo "$BOOTSTRAP_JSON" | jq '.errors // .'
            exit 1
          fi

          WORKLOAD_NAME=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            "${API}/workspaces/${WORKLOAD_ID}" \
            | jq -r '.data.attributes.name // "unknown"')

          echo "Workload workspace: ${WORKLOAD_NAME} (${WORKLOAD_ID})"
          echo "Bootstrap workspace: ${BOOTSTRAP_NAME} (${BOOTSTRAP_ID})"

          read_var_from_workspace() {
            local ws_id="$1"
            local key="$2"
            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/vars?page%5Bsize%5D=100" \
              | jq -r --arg k "$key" '
                  [.data[]? | select(.attributes.key == $k and .attributes.category == "env")][0].attributes.value // empty
                '
          }

          read_output_from_workspace() {
            local ws_id="$1"
            local key="$2"
            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/current-state-version-outputs" \
              | jq -r --arg k "$key" '
                  [.data[]? | select(.attributes.name == $k)][0].attributes.value // empty
                '
          }

          resolve_auth_value() {
            local bootstrap_key="$1"
            local output_key="$2"
            local val
            val=$(read_var_from_workspace "$BOOTSTRAP_ID" "$bootstrap_key")
            if [ -n "$val" ] && [ "$val" != "null" ]; then
              echo "$val"
              return
            fi
            read_output_from_workspace "$BOOTSTRAP_ID" "$output_key"
          }

          SA_EMAIL=$(resolve_auth_value "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL" "bootstrap_service_account_email")
          WIF_PROVIDER=$(resolve_auth_value "TFC_GCP_WORKLOAD_PROVIDER_NAME" "tfe_workload_identity_provider")

          if [ -z "$SA_EMAIL" ] || [ -z "$WIF_PROVIDER" ]; then
            echo "Could not resolve bootstrap auth values."
            echo "  TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL / bootstrap_service_account_email: ${SA_EMAIL:-<empty>}"
            echo "  TFC_GCP_WORKLOAD_PROVIDER_NAME / tfe_workload_identity_provider: ${WIF_PROVIDER:-<empty>}"
            echo "Set env vars on ${BOOTSTRAP_NAME} or ensure bootstrap outputs exist."
            exit 1
          fi

          echo "Bootstrap auth values resolved (will copy to workload after destroy)."

          echo "Queueing destroy run..."
          RUN_RESPONSE=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data "$(jq -n \
              --arg ws "$WORKLOAD_ID" \
              --arg msg "$RUN_MESSAGE" \
              '{
                data: {
                  type: "runs",
                  attributes: {
                    message: $msg,
                    "is-destroy": true
                  },
                  relationships: {
                    workspace: {
                      data: { type: "workspaces", id: $ws }
                    }
                  }
                }
              }')" \
            "${API}/runs")

          RUN_ID=$(echo "$RUN_RESPONSE" | jq -r '.data.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "Failed to queue destroy run"
            echo "$RUN_RESPONSE" | jq '.errors // .'
            exit 1
          fi
          echo "Destroy run queued: ${RUN_ID}"

          poll_run_status() {
            curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/runs/${RUN_ID}" \
              | jq -r '.data.attributes.status'
          }

          echo "Waiting for destroy plan..."
          for i in $(seq 1 60); do
            STATUS=$(poll_run_status)
            echo "  plan poll ${i}: ${STATUS}"
            case "$STATUS" in
              planned) break ;;
              errored|canceled|discarded) echo "Destroy plan failed: ${STATUS}"; exit 1 ;;
            esac
            sleep 10
          done

          if [ "$(poll_run_status)" != "planned" ]; then
            echo "Timed out waiting for destroy plan"
            exit 1
          fi

          echo "Applying destroy run..."
          APPLY_RESPONSE=$(curl -sS \
            --header "$(auth)" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            "${API}/runs/${RUN_ID}/actions/apply")

          if echo "$APPLY_RESPONSE" | jq -e '.errors' >/dev/null 2>&1; then
            echo "Apply failed (enable Allow destroy plans on the workload workspace):"
            echo "$APPLY_RESPONSE" | jq '.errors'
            exit 1
          fi

          echo "Waiting for destroy apply..."
          for i in $(seq 1 90); do
            STATUS=$(poll_run_status)
            echo "  apply poll ${i}: ${STATUS}"
            case "$STATUS" in
              applied) break ;;
              errored|canceled|discarded) echo "Destroy apply failed: ${STATUS}"; exit 1 ;;
            esac
            sleep 10
          done

          if [ "$(poll_run_status)" != "applied" ]; then
            echo "Timed out waiting for destroy apply"
            exit 1
          fi

          echo "Destroy applied successfully."

          upsert_env_var() {
            local ws_id="$1"
            local key="$2"
            local value="$3"
            local existing_id
            existing_id=$(curl -sS \
              --header "$(auth)" \
              --header "Content-Type: application/vnd.api+json" \
              "${API}/workspaces/${ws_id}/vars?page%5Bsize%5D=100" \
              | jq -r --arg k "$key" '
                  [.data[]? | select(.attributes.key == $k and .attributes.category == "env")][0].id // empty
                ')

            if [ -n "$existing_id" ]; then
              curl -sS \
                --header "$(auth)" \
                --header "Content-Type: application/vnd.api+json" \
                --request PATCH \
                --data "$(jq -n --arg val "$value" '{
                  data: {
                    type: "vars",
                    attributes: { value: $val }
                  }
                }')" \
                "${API}/vars/${existing_id}" >/dev/null
              echo "Updated ${key} on ${WORKLOAD_NAME}"
            else
              curl -sS \
                --header "$(auth)" \
                --header "Content-Type: application/vnd.api+json" \
                --request POST \
                --data "$(jq -n --arg key "$key" --arg val "$value" '{
                  data: {
                    type: "vars",
                    attributes: {
                      key: $key,
                      value: $val,
                      category: "env",
                      hcl: false,
                      sensitive: false
                    }
                  }
                }')" \
                "${API}/workspaces/${ws_id}/vars" >/dev/null
              echo "Created ${key} on ${WORKLOAD_NAME}"
            fi
          }

          echo "Copying bootstrap auth variables to ${WORKLOAD_NAME}..."
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL" "$SA_EMAIL"
          upsert_env_var "$WORKLOAD_ID" "TFC_GCP_WORKLOAD_PROVIDER_NAME" "$WIF_PROVIDER"

          echo "Done. Workload auth reset to bootstrap for next first run."
          echo "  TFC_GCP_RUN_SERVICE_ACCOUNT_EMAIL=${SA_EMAIL}"
          echo "  TFC_GCP_WORKLOAD_PROVIDER_NAME=${WIF_PROVIDER}"

  reject-unconfirmed:
    name: Destroy not confirmed
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'destroy'
    steps:
      - name: Require confirmation
        run: |
          echo "Destroy cancelled. Re-run and type exactly: destroy"
          exit 1
