name: Bump Bootstrap Auth

# Bumps bootstrap WIF pool/provider IDs in terraform-bootstrap/envs/dev,
# creates a branch, and opens a PR to feature/new-bootstrap.
# Does NOT copy TFC_GCP_* env vars to GCP-vaflt-tfe-workspace.

on:
  workflow_dispatch:

env:
  BASE_BRANCH: feature/new-bootstrap

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-bootstrap-auth:
    name: Bump bootstrap WIF and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Bump bootstrap WIF pool and provider IDs
        run: |
          set -euo pipefail
          BOOTSTRAP_TF="terraform-bootstrap/envs/dev/main.tf"

          POOL=$(awk -F'"' '/workload_identity_pool_id/ { print $2; exit }' "$BOOTSTRAP_TF")
          PROVIDER=$(awk -F'"' '/workload_identity_provider_id/ { print $2; exit }' "$BOOTSTRAP_TF")

          if [[ ! "$POOL" =~ ^tfe-pool-dev-[0-9]+$ ]]; then
            echo "FAIL: unexpected pool id: ${POOL}"
            exit 1
          fi
          if [[ ! "$PROVIDER" =~ ^tfe-provider-dev-[0-9]+$ ]]; then
            echo "FAIL: unexpected provider id: ${PROVIDER}"
            exit 1
          fi

          POOL_N="${POOL##*-}"
          NEXT=$((POOL_N + 1))

          sed -i "s/${POOL}/tfe-pool-dev-${NEXT}/" "$BOOTSTRAP_TF"
          sed -i "s/${PROVIDER}/tfe-provider-dev-${NEXT}/" "$BOOTSTRAP_TF"

          echo "bootstrap WIF bump:"
          echo "  ${POOL} -> tfe-pool-dev-${NEXT}"
          echo "  ${PROVIDER} -> tfe-provider-dev-${NEXT}"

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ env.BASE_BRANCH }}"
          BRANCH="bump/bootstrap-wif-dev-$(date +%Y%m%d%H%M%S)"
          BOOTSTRAP_TF="terraform-bootstrap/envs/dev/main.tf"

          if git diff --quiet -- "$BOOTSTRAP_TF"; then
            echo "No bootstrap changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$BOOTSTRAP_TF"
          git commit \
            -m "Bump bootstrap WIF pool/provider IDs (dev)." \
            -m "Rotates tfe-pool-dev-* and tfe-provider-dev-* in terraform-bootstrap/envs/dev." \
            -m "Apply GCP-Vaflt-Bootstrap after merge, then update TFC_GCP_WORKLOAD_PROVIDER_NAME on GCP-vaflt-tfe-workspace if needed."
          git push origin "$BRANCH"

          PR_BODY="## Summary"$'\n'"- Bumps workload_identity_pool_id and workload_identity_provider_id in terraform-bootstrap/envs/dev/main.tf"$'\n\n'"## After merge"$'\n'"1. Apply GCP-Vaflt-Bootstrap"$'\n'"2. Update TFC_GCP_WORKLOAD_PROVIDER_NAME on GCP-vaflt-tfe-workspace from bootstrap outputs (if needed)"$'\n'"3. Re-run platform apply on GCP-vaflt-tfe-workspace"

          PR_URL="https://github.com/${{ github.repository }}/compare/${BASE}...${BRANCH}?expand=1"

          if gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Bump bootstrap WIF pool/provider (dev)" \
            --body "$PR_BODY" 2>/dev/null; then
            echo "Pull request created."
          else
            echo ""
            echo "Branch pushed. Open PR manually (Actions cannot create PRs until enabled in repo settings):"
            echo "  Settings → Actions → General → Allow GitHub Actions to create and approve pull requests"
            echo ""
            echo "  ${PR_URL}"
          fi
